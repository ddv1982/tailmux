name: Release

on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      main_sha: ${{ steps.protection.outputs.main_sha }}
      source_sha: ${{ steps.protection.outputs.source_sha }}
      tag: ${{ steps.protection.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require existing protection and reviewed source
        id: protection
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          EXPECTED_SOURCE_SHA: ${{ vars.RELEASE_SOURCE_SHA }}
        run: python3 scripts/release/preflight.py --tag "$TAG" --source-sha "$EXPECTED_SOURCE_SHA"

  publish:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
      attestations: write
      id-token: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.preflight.outputs.tag }}
      EXPECTED_SOURCE_SHA: ${{ vars.RELEASE_SOURCE_SHA }}
      PREFLIGHT_SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
      REVIEWED_MAIN_SHA: ${{ needs.preflight.outputs.main_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Repeat protection checks after approval
        run: |
          test "$EXPECTED_SOURCE_SHA" = "$PREFLIGHT_SOURCE_SHA"
          python3 scripts/release/preflight.py --tag "$TAG" --source-sha "$EXPECTED_SOURCE_SHA" --main-sha "$REVIEWED_MAIN_SHA"
      - name: Refuse release until acceptance is enabled
        run: |
          printf '%s\n' 'Release acceptance is not enabled. PR-05 must install the reviewed evidence gate.' >&2
          exit 1
      - name: Build exact committed package
        run: |
          mkdir -m 700 dist
          python3 scripts/release/package.py build --tag "$TAG" --source-sha "$EXPECTED_SOURCE_SHA" --output "dist/tailmux-${TAG}.tar.gz"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: dist/tailmux-${{ needs.preflight.outputs.tag }}.tar.gz
          push-to-registry: false
          create-storage-record: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: tailmux-${{ needs.preflight.outputs.tag }}
          path: dist/tailmux-${{ needs.preflight.outputs.tag }}.tar.gz
          if-no-files-found: error
          retention-days: 7
      - name: Publish attested archive
        run: |
          gh release create "$TAG" "dist/tailmux-${TAG}.tar.gz" --repo ddv1982/tailmux --verify-tag --target "$EXPECTED_SOURCE_SHA" --title "$TAG" --notes "Portable package. Verify publisher and expected source before unpacking. See docs/releases.md."
